[project]
name = "mml-classifier"
version = "0.1.0"
description = "MML Productivity classifier sidecar — extends the warehouse classifier with LLM content scoring for fall-through clusters and exposes a localhost HTTP endpoint for the Mailspring plugin."
requires-python = ">=3.11"
authors = [{ name = "MML Productivity contributors" }]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
test = ["pytest>=8.0"]

[project.scripts]
mml-classifier-server   = "mml_classifier.server:main"
mml-classifier-backfill = "mml_classifier.backfill:main"
mml-classifier-smoke    = "mml_classifier.claude_cli:smoke_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mml_classifier*"]
